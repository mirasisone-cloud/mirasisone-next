name: Localize Wix images

# GitHub の Actions タブから手動で実行します（Run workflow ボタン）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wix画像をダウンロードしてJSONを書き換え
        run: node scripts/localize-wix-images.mjs

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/blog/wix src/content/blog-posts-data.json
          if git diff --cached --quiet; then
            echo "変更はありませんでした"
            exit 0
          fi
          git commit -m "chore: Wix CDNの画像をリポジトリ内に取り込み、参照をローカルパスへ変更"
          git push
