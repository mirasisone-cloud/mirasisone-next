name: コンテンツJSONの検証

# GitHub の Web エディタから src/content を直接編集したときに、
# 壊れた JSON がそのまま本番デプロイに流れるのを早期に検知する。
# 2026-10-27 / 11-02 / 11-04 / 11-13 の本番デプロイ失敗は4件ともこれが原因だった。
on:
  push:
    paths:
      - "src/content/**.json"
      - "scripts/validate-content.mjs"
  pull_request:
    paths:
      - "src/content/**.json"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: コンテンツJSONを検証
        run: node scripts/validate-content.mjs
